<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta property="og:title" content="弦音 Tuner — 极简在线调音器">
  <meta property="og:description" content="打开麦克风，立即开始调音。音频仅在本机处理。">
  <meta property="og:image" content="https://rexrockya.github.io/tuner/og.png">

  <link rel="icon" href="favicon.svg">
  <style>
    :root{--ink:#0d110d;--cream:#f2f0e6;--lime:#bdf45d;--muted:#7e8679}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--cream);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}
    nav{height:72px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #293026}.brand{font-size:23px;font-weight:800;letter-spacing:-1.5px}.brand span{margin-left:10px;color:var(--lime);font:9px/1 monospace;letter-spacing:1.5px;vertical-align:3px}nav div{display:flex;gap:26px;color:#92998d;font-size:12px}nav a:hover{color:var(--lime)}
    main{min-height:calc(100svh - 72px);padding:clamp(26px,5vh,54px) clamp(20px,8vw,120px) clamp(24px,4vh,44px);display:grid;grid-template-rows:auto 1fr auto auto;justify-items:center;position:relative;overflow:hidden}main:before{content:"";position:absolute;width:min(74vw,780px);aspect-ratio:1;top:42%;left:50%;transform:translate(-50%,-50%);border:1px solid #222920;border-radius:50%;pointer-events:none}
    .status{justify-self:start;color:var(--muted);font:11px/1 monospace;letter-spacing:1.6px}.status i{display:inline-block;width:7px;height:7px;margin-right:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime)}
    .pitch{align-self:center;text-align:center;z-index:1}.note{font-size:clamp(150px,24vw,330px);font-weight:800;line-height:.8;letter-spacing:-.09em}.note sup{margin-left:12px;color:var(--muted);font-size:clamp(22px,3vw,36px);letter-spacing:0}.frequency{margin-top:30px;color:var(--muted);font:13px/1 monospace}.tuned .note,.tuned .tune-state{color:var(--lime)}
    .meter-wrap{width:min(680px,100%);z-index:1}.meter-labels{display:flex;justify-content:space-between;color:#555d52;font:9px/1 monospace}.meter{height:42px;margin-top:10px;position:relative;border-top:1px solid #333b30;background:repeating-linear-gradient(90deg,#454e41 0 1px,transparent 1px 5%)}.meter:after{content:"";position:absolute;left:50%;height:42px;border-left:2px solid var(--lime)}.needle{position:absolute;left:50%;width:3px;height:42px;transform:translateX(-1px);background:var(--cream);box-shadow:0 0 12px #f2f0e677;transition:left .12s ease-out}.tune-state{margin-top:12px;text-align:center;color:#9da499;font-size:13px}
    .controls{margin-top:clamp(22px,4vh,42px);text-align:center;z-index:1}button{min-width:160px;padding:15px 24px;border:0;border-radius:4px;background:var(--lime);color:var(--ink);cursor:pointer;font:700 14px/1 sans-serif}button:hover{filter:brightness(1.08)}button:focus-visible{outline:2px solid var(--cream);outline-offset:4px}.privacy{margin:16px 0 0;color:#5f675c;font-size:10px}.error{display:none;max-width:360px;margin:10px auto 0;color:#d49e92;font-size:11px}
    @media(max-width:600px){nav{height:64px}nav div{gap:18px}nav div a:last-child{display:none}main{min-height:calc(100svh - 64px);padding:26px 20px 24px}main:before{width:110vw;top:40%}.note{font-size:min(48vw,220px)}.frequency{margin-top:24px}.meter,.meter:after,.needle{height:34px}.controls{margin-top:24px}}
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="#top">弦音<span>TUNER</span></a>
    <div><a href="https://github.com/rexrockya/tuner/releases/latest/download/tuner.apk">下载 APK</a><a href="https://github.com/rexrockya/tuner">GitHub ↗</a></div>
  </nav>
  <main id="top">
    <div class="status"><i></i><span id="status">准备就绪</span></div>
    <div class="pitch" aria-live="polite"><div class="note"><span id="note">—</span><sup id="octave"></sup></div><div class="frequency" id="frequency">— Hz</div></div>
    <div class="meter-wrap"><div class="meter-labels"><span>−50</span><span>0</span><span>+50</span></div><div class="meter"><span class="needle" id="needle"></span></div><div class="tune-state" id="tune-state">弹奏一个音</div></div>
    <div class="controls"><button id="toggle">开启麦克风</button><p class="privacy">音频仅在本机处理，不会录制或上传</p><p class="error" id="error"></p></div>
  </main>
  <script>
    const NOTES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
    const ui={main:document.querySelector("main"),status:document.querySelector("#status"),note:document.querySelector("#note"),octave:document.querySelector("#octave"),frequency:document.querySelector("#frequency"),needle:document.querySelector("#needle"),state:document.querySelector("#tune-state"),toggle:document.querySelector("#toggle"),error:document.querySelector("#error")};
    let running=false,stop=null;
    function detectPitch(buffer,sampleRate){let power=0;for(const value of buffer)power+=value*value;if(Math.sqrt(power/buffer.length)<.012)return-1;const min=Math.floor(sampleRate/1200),max=Math.min(Math.floor(sampleRate/55),Math.floor(buffer.length/2)),diff=new Float64Array(max+1);for(let lag=min;lag<=max;lag++){let sum=0;for(let i=0;i<buffer.length-lag;i++){const delta=buffer[i]-buffer[i+lag];sum+=delta*delta}diff[lag]=sum/(buffer.length-lag)}for(let lag=min+1;lag<max;lag++)if(diff[lag]<diff[lag-1]&&diff[lag]<=diff[lag+1]&&diff[lag]<.03)return sampleRate/lag;return-1}
    function render(pitch){if(pitch<0)return;const midi=Math.round(69+12*Math.log2(pitch/440)),note=NOTES[(midi%12+12)%12],cents=1200*Math.log2(pitch/(440*2**((midi-69)/12))),tuned=Math.abs(cents)<5;ui.note.textContent=note;ui.octave.textContent=Math.floor(midi/12)-1;ui.frequency.textContent=`${pitch.toFixed(1)} Hz`;ui.needle.style.left=`${50+Math.max(-50,Math.min(50,cents))}%`;ui.state.textContent=tuned?"音准":cents<0?"偏低":"偏高";ui.main.classList.toggle("tuned",tuned)}
    ui.toggle.addEventListener("click",async()=>{if(running){stop?.();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),context=new AudioContext(),analyser=context.createAnalyser();analyser.fftSize=4096;context.createMediaStreamSource(stream).connect(analyser);const samples=new Float32Array(analyser.fftSize);let frame;running=true;ui.status.textContent="正在聆听";ui.toggle.textContent="停止";ui.error.style.display="none";const update=()=>{analyser.getFloatTimeDomainData(samples);render(detectPitch(samples,context.sampleRate));frame=requestAnimationFrame(update)};stop=()=>{if(!running)return;running=false;cancelAnimationFrame(frame);stream.getTracks().forEach(track=>track.stop());if(context.state!=="closed")context.close();ui.status.textContent="准备就绪";ui.toggle.textContent="开启麦克风";ui.note.textContent="—";ui.octave.textContent="";ui.frequency.textContent="— Hz";ui.needle.style.left="50%";ui.state.textContent="弹奏一个音";ui.main.classList.remove("tuned");stop=null};update()}catch(error){ui.error.textContent="无法使用麦克风，请检查浏览器权限。";ui.error.style.display="block"}});
  </script>
</body>
</html>
