<body>
  <nav>

    <div class="tabs"><button class="tab active" data-page="tuner">调音</button><button class="tab" data-page="lesson">教学</button><button class="tab" data-page="metro">节拍</button></div>

  <main id="top" data-view="tuner">

    <div class="lesson-head"><div><h1 class="lesson-title" id="lesson-title"></h1><div class="lesson-meta" id="lesson-meta"></div></div><div class="lesson-harmonic"><h2 class="track-title" id="lesson-track"></h2><div class="harmony" id="lesson-harmony"></div></div></div>
    <div class="player-panel"><div class="mini-player"><button id="play-lick" aria-label="播放 Lick">▶</button><div class="timeline" id="lick-timeline"><div class="waveform" id="lick-waveform" role="slider" tabindex="0" aria-label="Lick 波形进度" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="0:00 / 0:00"><canvas id="lick-waveform-canvas"></canvas></div><span class="loop-region" id="loop-region"></span><span class="waveform-playhead" id="waveform-playhead"></span><button class="loop-marker loop-marker-a" id="loop-a-marker" aria-label="拖动 A 循环起点">A</button><button class="loop-marker loop-marker-b" id="loop-b-marker" aria-label="拖动 B 循环终点">B</button></div><span id="lick-time">0:00</span></div><details class="ab-disclosure"><summary>精确 A/B</summary><div class="ab-editor" aria-label="A/B 循环精确设置"><label class="ab-point"><strong>A</strong><input id="loop-a-time" type="number" min="0" step="0.01" value="0.00" inputmode="decimal" aria-label="A 点秒数"><span>秒</span><button id="set-loop-a" type="button">当前</button></label><label class="ab-point"><strong>B</strong><input id="loop-b-time" type="number" min="0.02" step="0.01" value="1.00" inputmode="decimal" aria-label="B 点秒数"><span>秒</span><button id="set-loop-b" type="button">当前</button></label><button class="ab-reset" id="reset-loop-points" type="button">整段</button><button class="hint-button" data-tip="拖动波形上的 A/B 标记或输入秒数。方向键微调 0.05 秒，按住 Shift 为 0.01 秒。" aria-label="A/B 操作帮助">?</button></div></details><div class="score-stage" id="score-stage"><div class="score-toolbar"><span>谱面</span><div><button id="score-minus" aria-label="缩小谱面" title="缩小谱面">−</button><button id="score-zoom" aria-label="重置谱面缩放" title="恢复 100%">100%</button><button id="score-plus" aria-label="放大谱面" title="放大谱面">＋</button><button id="score-expand" aria-label="全屏谱面" title="全屏谱面">⛶</button></div></div><div class="lick-staff" id="lick-staff" aria-label="Lick 五线谱"></div></div><div class="sync-tools"><div class="tempo-control" aria-label="练习速度"><button id="lesson-bpm-minus" aria-label="降低练习速度">−</button><output id="lesson-bpm">80 BPM</output><button id="lesson-bpm-plus" aria-label="提高练习速度">＋</button></div><button id="lesson-original-speed" title="恢复示范音频原速度" aria-label="恢复原速 120 BPM">原速 120</button><button id="toggle-backing" title="播放按当前和弦实时生成的伴奏" aria-pressed="false">伴奏：关</button><button id="toggle-demo" title="关闭后只保留伴奏" class="on" aria-pressed="true">示范音：开</button><button id="lesson-metro" title="打开或关闭节拍器">节拍：关</button><button id="toggle-loop" title="在 A/B 标记之间循环">A/B：开</button><button id="master-lick" title="加入已掌握统计">标记已掌握</button></div></div>
    <details class="insight-panel"><summary>为什么这样走</summary><div class="bar-detail" id="bar-detail"></div></details>
    <details class="scale-lab" id="scale-lab"><summary id="scale-lab-title">音阶训练</summary><div class="scale-lab-body"><div class="scale-lab-head"><p>跟随上方 BPM</p><button class="hint-button" data-tip="先听持续根音上的特征音，再练上下行；最后用两条短 Lick 把音阶变成语言。" aria-label="音阶练习帮助">?</button></div><div class="scale-controls"><label>根音<select id="scale-root" aria-label="音阶根音"></select></label><label>音阶<select id="scale-type" aria-label="音阶类型"></select></label><label>音色<select id="scale-instrument" aria-label="试听音色"><option value="guitar">木吉他</option><option value="piano">钢琴</option></select></label></div><div class="scale-summary"><h4 id="scale-name"></h4><p><strong>公式：</strong><span id="scale-formula"></span></p><p id="scale-use"></p><p class="scale-character" id="scale-character"></p><div class="scale-notes" id="scale-notes"></div></div><div class="scale-actions" aria-label="音阶练习模式"><button class="scale-feel" id="scale-feel">▶ 听感</button><button data-scale-pattern="up">上行</button><button data-scale-pattern="updown">上下行</button><button data-scale-pattern="thirds">三度</button><button data-scale-pattern="four">四音组</button><button class="scale-stop" id="scale-stop">停止</button></div><p class="scale-status" id="scale-status">选择根音、音阶和音色后开始跟练</p><div class="scale-licks"><h4>音阶内 Lick</h4><div class="scale-lick-list" id="scale-lick-list"></div></div></div></details>
    <div class="lesson-foot"><button id="favorite-lick">☆ 收藏这条 Lick</button><p class="source-hint" id="preview-status"></p></div>
  </section>
  <section id="metro-page" data-view="metro"><div class="role-switch"><button id="choose-parent">我是家长</button><button id="choose-child">我是孩子</button></div><div class="lesson-kicker">请选择使用身份</div><div class="metro-dot" id="metro-dot"></div><div class="metro-bpm" id="metro-bpm">80</div><p class="metro-unit">BPM</p><div class="metro-controls"><button class="secondary" id="metro-minus">− 5</button><button class="secondary" id="metro-plus">+ 5</button></div><button class="metro-start" id="metro-start">开始</button><div class="tempo-presets" aria-label="拍速预设"><button data-bpm="80">80</button><button data-bpm="72">72</button><button data-bpm="100">100</button><button data-bpm="60">60</button></div><div class="remote-box" id="remote-box"><strong id="remote-title">请选择家长端或孩子端</strong><p class="metro-hint" id="remote-hint">以后只需点击上方按钮，无需修改网址</p><input id="room-code" inputmode="numeric" maxlength="6" placeholder="000000"><button id="remote-send">同步当前拍速</button><p class="metro-hint" id="remote-status"></p></div></section>
<script src="lessons.js?v=20260830-7"></script>
  <script>
    const NOTES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
    const ui={main:document.querySelector("main"),status:document.querySelector("#status"),note:document.querySelector("#note"),octave:document.querySelector("#octave"),frequency:document.querySelector("#frequency"),needle:document.querySelector("#needle"),state:document.querySelector("#tune-state"),toggle:document.querySelector("#toggle"),error:document.querySelector("#error")};
    let running=false,stop=null;
    function detectPitch(buffer,sampleRate){let power=0;for(const value of buffer)power+=value*value;if(Math.sqrt(power/buffer.length)<.012)return-1;const min=Math.floor(sampleRate/1200),max=Math.min(Math.floor(sampleRate/55),Math.floor(buffer.length/2)),diff=new Float64Array(max+1);for(let lag=min;lag<=max;lag++){let sum=0;for(let i=0;i<buffer.length-lag;i++){const delta=buffer[i]-buffer[i+lag];sum+=delta*delta}diff[lag]=sum/(buffer.length-lag)}for(let lag=min+1;lag<max;lag++)if(diff[lag]<diff[lag-1]&&diff[lag]<=diff[lag+1]&&diff[lag]<.03)return sampleRate/lag;return-1}
    function render(pitch){if(pitch<0)return;const midi=Math.round(69+12*Math.log2(pitch/440)),note=NOTES[(midi%12+12)%12],cents=1200*Math.log2(pitch/(440*2**((midi-69)/12))),tuned=Math.abs(cents)<5;ui.note.textContent=note;ui.octave.textContent=Math.floor(midi/12)-1;ui.frequency.textContent=`${pitch.toFixed(1)} Hz`;ui.needle.style.left=`${50+Math.max(-50,Math.min(50,cents))}%`;ui.state.textContent=tuned?"音准":cents<0?"偏低":"偏高";ui.main.classList.toggle("tuned",tuned)}
    ui.toggle.addEventListener("click",async()=>{if(running){stop?.();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),context=new AudioContext(),analyser=context.createAnalyser();analyser.fftSize=4096;context.createMediaStreamSource(stream).connect(analyser);const samples=new Float32Array(analyser.fftSize);let frame;running=true;ui.status.textContent="正在聆听";ui.toggle.textContent="停止";ui.error.style.display="none";const update=()=>{analyser.getFloatTimeDomainData(samples);render(detectPitch(samples,context.sampleRate));frame=requestAnimationFrame(update)};stop=()=>{if(!running)return;running=false;cancelAnimationFrame(frame);stream.getTracks().forEach(track=>track.stop());if(context.state!=="closed")context.close();ui.status.textContent="准备就绪";ui.toggle.textContent="开启麦克风";ui.note.textContent="—";ui.octave.textContent="";ui.frequency.textContent="— Hz";ui.needle.style.left="50%";ui.state.textContent="弹奏一个音";ui.main.classList.remove("tuned");stop=null};update()}catch(error){ui.error.textContent="无法使用麦克风，请检查浏览器权限。";ui.error.style.display="block"}});
    const FAMILY_TOPIC="xianyin-726518-family-metronome-v2",pageMode=new URLSearchParams(location.search).get("mode"),isParent=pageMode==="parent";let metroBpm=Math.max(30,Math.min(240,Number(localStorage.getItem("tuner-bpm-v1")||80))),metroRunning=false,metroTimer=null,metroAudio=null;const metroPage=document.querySelector("#metro-page"),metroValue=document.querySelector("#metro-bpm"),metroDot=document.querySelector("#metro-dot"),metroStart=document.querySelector("#metro-start");metroValue.textContent=metroBpm;
    function metroPulse(){metroDot.classList.add("flash");setTimeout(()=>metroDot.classList.remove("flash"),100);metroAudio??=new AudioContext();const o=metroAudio.createOscillator(),g=metroAudio.createGain();o.frequency.value=1100;g.gain.setValueAtTime(.2,metroAudio.currentTime);g.gain.exponentialRampToValueAtTime(.001,metroAudio.currentTime+.05);o.connect(g).connect(metroAudio.destination);o.start();o.stop(metroAudio.currentTime+.05)}
    function metroBeat(){metroValue.textContent=metroBpm;metroPulse();metroTimer=setTimeout(metroBeat,60000/metroBpm)}
    function startCountIn(){clearTimeout(metroTimer);let count=4;const tick=()=>{if(!metroRunning){metroValue.textContent=metroBpm;return}metroValue.textContent=count;metroPulse();if(count>1){count--;metroTimer=setTimeout(tick,60000/metroBpm)}else metroTimer=setTimeout(()=>{metroValue.textContent=metroBpm;if(metroRunning)metroBeat()},60000/metroBpm)};tick()}
    async function pushFamilyState(){if(!isParent)return;const status=document.querySelector("#remote-status");status.textContent="正在推送…";try{const r=await fetch("https://ntfy.sh/",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({topic:FAMILY_TOPIC,message:JSON.stringify({bpm:metroBpm,running:metroRunning,at:Date.now()}),title:"metronome"})});if(!r.ok)throw 0;status.textContent=`已推送：${metroBpm} BPM · ${metroRunning?"开始":"停止"}`}catch(e){status.textContent="推送失败 · 请检查家长手机网络"}}
    function notifyMetro(){localStorage.setItem("tuner-bpm-v1",String(metroBpm));window.dispatchEvent(new CustomEvent("tuner:metro-change",{detail:{bpm:metroBpm,running:metroRunning}}))}
    function setMetro(n,remote=false){metroBpm=Math.max(30,Math.min(240,n));metroValue.textContent=metroBpm;if(metroRunning){clearTimeout(metroTimer);metroBeat()}notifyMetro();if(!remote)pushFamilyState()}
    function setMetroRunning(next,countIn=true){metroRunning=Boolean(next);metroStart.textContent=metroRunning?"停止":"开始";clearTimeout(metroTimer);if(metroRunning){countIn?startCountIn():metroBeat()}else metroValue.textContent=metroBpm;notifyMetro();pushFamilyState()}
    document.querySelector("#metro-minus").onclick=()=>setMetro(metroBpm-5);document.querySelector("#metro-plus").onclick=()=>setMetro(metroBpm+5);metroStart.onclick=()=>setMetroRunning(!metroRunning);
    window.metronome={getBpm:()=>metroBpm,isRunning:()=>metroRunning,setBpm:setMetro,toggle:()=>setMetroRunning(!metroRunning),start:()=>setMetroRunning(true,false),stop:()=>setMetroRunning(false)};
    document.querySelectorAll(".tempo-presets button").forEach(button=>button.onclick=()=>setMetro(Number(button.dataset.bpm)));
    document.querySelector("#remote-send").onclick=async()=>{const code=document.querySelector("#room-code").value,status=document.querySelector("#remote-status");if(!/^\d{6}$/.test(code)){status.textContent="请输入 6 位控制码";return}status.textContent="正在同步…";try{const r=await fetch(`https://xianyin-tuner.cobainrexzhang.chatgpt.site/api/metronome/${code}`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({bpm:metroBpm,running:metroRunning})});if(!r.ok)throw 0;status.textContent="已同步到孩子手机"}catch(e){status.textContent="同步失败，请稍后重试"}};
    document.querySelector("#choose-parent").onclick=()=>location.href="?mode=parent";document.querySelector("#choose-child").onclick=()=>location.href="?mode=child";
    document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(item=>item.classList.toggle("active",item===tab));const page=tab.dataset.page;document.querySelector('main[data-view="tuner"]').style.display=page==="tuner"?"grid":"none";document.querySelector('#lesson-page').style.display=page==="lesson"?"block":"none";metroPage.style.display=page==="metro"?"block":"none";if(page!=="tuner")stop?.();if(page!=="lesson")window.lessonPlayer?.stop()}));
    if(location.hash.startsWith("#lick/"))document.querySelector('.tab[data-page="lesson"]').click();
    if(pageMode==="child"||isParent){document.title=isParent?"家长遥控端｜弦音节拍器":"孩子演奏端｜弦音节拍器";document.querySelector(isParent?"#choose-parent":"#choose-child").classList.add("active");document.querySelector('.tab[data-page="metro"]').click();document.querySelector(".lesson-kicker").textContent=isParent?"家长遥控端 · PARENT":"孩子演奏端 · CHILD";const input=document.querySelector("#room-code"),send=document.querySelector("#remote-send"),status=document.querySelector("#remote-status");input.style.display="none";send.style.display="none";document.querySelector("#remote-title").textContent=isParent?"家长遥控端":"孩子演奏端";document.querySelector("#remote-hint").textContent=isParent?"这里每次操作都会自动发送给孩子":"请勿在孩子端操作；拍速和启停由家长手机控制";status.textContent=isParent?"家长端已就绪":"正在连接遥控通道…";if(pageMode==="child"){document.querySelector(".metro-controls").style.display="none";document.querySelector(".tempo-presets").style.display="none";metroStart.style.display="none";const stream=new EventSource(`https://ntfy.sh/${FAMILY_TOPIC}/sse?since=10m`);stream.onopen=()=>status.textContent="孩子端已就绪 · 等待家长操作";stream.onmessage=e=>{try{const envelope=JSON.parse(e.data);if(envelope.event!=="message")return;const data=JSON.parse(envelope.message);setMetro(Number(data.bpm),true);if(Boolean(data.running)!==metroRunning){metroRunning=Boolean(data.running);metroStart.textContent=metroRunning?"停止":"开始";clearTimeout(metroTimer);if(metroRunning)startCountIn();else metroValue.textContent=metroBpm}status.textContent=`刚收到遥控：${data.bpm} BPM · ${data.running?"开始":"停止"}`}catch(err){}};stream.onerror=()=>status.textContent="孩子端网络中断 · 正在自动重连"}}
  </script>
